<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Certificación Electrónica | DGB</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="https://framework-gb.cdn.gob.mx/gm/accesibilidad/css/gobmx-accesibilidad.min.css" rel="stylesheet">
    
    <style>
        :root {
            --sep-rojo-obscuro: #4B1021; 
            --gob-oro: #9D843E;   
            --btn-buscar-verde: #285848;
            --btn-limpiar-gris: #767676;
            --estatus-verde: #235E3F;
            --bg-info-azul: #D9EDF7;
            --border-info-azul: #BCE8F1;
            --texto-info-azul: #31708F;
            --error-rojo: #B00020;
            --error-bg: #F9E6E9;
        }

        .grayscale-mode { filter: grayscale(100%); }
        .high-contrast { background: #000 !important; color: #fff100 !important; }
        .high-contrast * { background-color: #000 !important; color: #fff100 !important; border-color: #fff100 !important; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        .sticky-nav-container { position: sticky; top: 0; z-index: 1000; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav.gob-header { background-color: var(--sep-rojo-obscuro); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo-gob { height: 60px; }
        .menu-icon { color: white; font-size: 24px; cursor: pointer; }
        
        .nav-menu { display: none; position: absolute; right: 30px; top: 50px; background: var(--sep-rojo-obscuro); min-width: 200px; border-radius: 4px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); z-index: 100; }
        .nav-menu.show { display: block; }
        .nav-menu a { color: white; padding: 12px 20px; text-decoration: none; display: block; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); }

        .barra-dgb { background-color: var(--gob-oro); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .dgb-brand { font-size: 20px; font-weight: 600; }

        /* Estilos para coincidir con la imagen */
        .breadcrumb-container { max-width: 900px; margin: 30px auto 10px; padding: 0 15px; width: 100%; }
        .breadcrumb { font-size: 14px; color: #666; margin-bottom: 5px; }
        .titulo-seccion { font-size: 18px; font-weight: 700; color: #333; }

        main { flex: 1; max-width: 900px; margin: 10px auto 30px; padding: 0 15px; width: 100%; }
        .search-outer-box { background: #ffffff; border: 1px solid var(--gob-oro); border-radius: 8px; padding: 35px; margin-bottom: 20px; }

        /* MODIFICACIÓN: BARRA QUE SE EXPANDE */
        input { 
            width: 100%; 
            max-width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 18px; 
            margin-bottom: 20px; 
            font-family: 'Lora', serif; 
            transition: max-width 0.5s ease;
            display: block;
        }

        @media (min-width: 1024px) {
            input { max-width: 400px; }
            input:focus { max-width: 100%; border-color: var(--gob-oro); outline: none; }
        }

        /* Botones a la par */
        .btn-container { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn-new { flex: 1; min-width: 150px; padding: 14px; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; color: white; font-family: 'Montserrat'; font-weight: 600; text-align: center; }
        .btn-buscar { background-color: var(--btn-buscar-verde); }
        .btn-limpiar { background-color: var(--btn-limpiar-gris); }

        .link-ayuda { display: block; text-align: center; margin-top: 15px; color: var(--gob-oro); text-decoration: underline; font-size: 14px; cursor: pointer; }

        /* RESULTADOS */
        #resultado { display: none; margin-top: 40px; background: white; padding: 35px; border-radius: 8px; border-left: 8px solid var(--estatus-verde); text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        /* FOOTER COMPLETO */
        footer { background: var(--sep-rojo-obscuro); color: white; padding: 40px 30px; margin-top: auto; }
        .footer-container { max-width: 1000px; margin: 0 auto; text-align: center; }
        .subsecretaria { font-weight: 600; font-size: 14px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div id="accessibility-menu"></div>

<div class="sticky-nav-container">
    <nav class="gob-header">
        <div class="header-left-group">
            <a href="https://www.gob.mx"><img class="logo-gob" src="https://consultadelestadoactual.info/images/gobierno-de-mexico.svg" alt="Gobierno de México"></a>
        </div>
        <i class="fas fa-bars menu-icon" onclick="toggleMenu('navMenu')"></i>
        <div id="navMenu" class="nav-menu">
            <a href="https://www.gob.mx/tramites">Trámites</a>
            <a href="https://www.gob.mx/gobierno">Gobierno</a>
        </div>
    </nav>
    <div class="barra-dgb">
        <div class="dgb-brand">DGB</div>
        <i class="fas fa-bars" style="cursor:pointer" onclick="toggleMenu('navMenu')"></i>
    </div>
</div>

<div class="breadcrumb-container">
    <div class="breadcrumb">Inicio / Consultas</div>
    <div class="titulo-seccion">Documentos académicos electrónicos</div>
</div>

<main>
    <div class="search-outer-box">
        <input type="text" id="folioInput" placeholder="Ingrese el folio">
        <div class="btn-container">
            <button class="btn-new btn-buscar" onclick="realizarBusqueda()">Buscar</button>
            <button class="btn-new btn-limpiar" onclick="restablecer()">Restablecer</button>
        </div>
        <span class="link-ayuda">Ubica el folio en tu certificado</span>

        <div id="resultado">
            <h3 style="color: var(--estatus-verde)">Resultado de la consulta</h3>
            <p id="res-text" style="margin-top:15px"></p>
        </div>
    </div>
</main>

<footer>
    <div class="footer-container">
        <span class="subsecretaria">Subsecretaría de Educación Media Superior y Superior</span>
        <p style="font-size: 12px; opacity: 0.8;">&copy; 2024 Dirección General del Bachillerato - Secretaría de Educación Pública</p>
    </div>
</footer>

<script src="https://cdn.gob.mx"></script>
<script>
    function toggleMenu(id) {
        document.getElementById(id).classList.toggle("show");
    }

    function realizarBusqueda() {
        const folio = document.getElementById('folioInput').value;
        if(folio.trim() === "") {
            alert("Por favor, ingrese un folio");
            return;
        }
        document.getElementById('resultado').style.display = "block";
        document.getElementById('res-text').innerHTML = "Folio <b>" + folio + "</b> validado exitosamente.";
    }

    function restablecer() {
        document.getElementById('folioInput').value = "";
        document.getElementById('resultado').style.display = "none";
    }
</script>

</body>
</html>
