<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Certificación Electrónica | DGB</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --sep-rojo-obscuro: #4B1021; 
            --gob-oro: #9D843E;   
            --btn-buscar-verde: #285848;
            --btn-limpiar-gris: #767676;
        }

        body { font-family: 'Montserrat', sans-serif; background-color: #f4f4f4; margin: 0; }

        /* Contenedor principal */
        .search-outer-box { 
            background: #ffffff; 
            border: 2px solid #D4C19C; 
            border-radius: 10px; 
            padding: 30px; 
            max-width: 600px; /* Ancho máximo del cuadro blanco */
            margin: 50px auto; 
            text-align: center; 
        }

        /* --- LA MODIFICACIÓN ESTÁ AQUÍ --- */
        input[type="text"] { 
            width: 250px; /* Ancho corto inicial */
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 18px; 
            margin-bottom: 15px; 
            font-family: 'Lora', serif; 
            text-align: center;
            transition: width 0.4s ease-in-out; /* Animación de expansión */
            display: inline-block;
        }

        /* Expansión en PC al hacer clic */
        @media (min-width: 1024px) {
            input[type="text"]:focus { 
                width: 100%; /* Se expande a lo largo de todo el cuadro */
                border-color: var(--gob-oro);
                outline: none;
            }
        }
        /* ---------------------------------- */

        .btn-new { width: 100%; padding: 14px; border: none; border-radius: 4px; font-size: 20px; cursor: pointer; margin-bottom: 10px; color: white; font-family: 'Montserrat'; font-weight: 500; text-decoration: none; display: block; }
        .btn-buscar { background-color: var(--btn-buscar-verde); }
        .btn-limpiar { background-color: var(--btn-limpiar-gris); }
    </style>
</head>
<body>

    <main>
        <div class="search-outer-box">
            <input type="text" placeholder="Introduce el folio de búsqueda">
            <button class="btn-new btn-buscar">BUSCAR</button>
            <button class="btn-new btn-limpiar">LIMPIAR</button>
        </div>
    </main>

</body>
</html>
