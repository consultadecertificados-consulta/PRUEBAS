<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Certificación Electrónica | DGB</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <link href="https://cdn.gob.mx" rel="stylesheet">
    
    <style>
        :root {
            --sep-rojo-obscuro: #4B1021; 
            --gob-oro: #9D843E;   
            --btn-buscar-verde: #285848;
            --btn-limpiar-gris: #767676;
            --estatus-verde: #235E3F;
            --bg-info-azul: #D9EDF7;
            --border-info-azul: #BCE8F1;
            --texto-info-azul: #31708F;
            --error-rojo: #B00020;
            --error-bg: #F9E6E9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        /* Navegación Superior */
        .sticky-nav-container { position: sticky; top: 0; z-index: 1000; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav.gob-header { background-color: var(--sep-rojo-obscuro); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header-left-group { display: flex; align-items: center; gap: 20px; }
        .logo-gob { height: 60px; }
        .menu-icon { color: white; font-size: 24px; cursor: pointer; }

        .barra-dgb { background-color: var(--gob-oro); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .dgb-brand { font-size: 20px; font-weight: 600; }

        /* --- NUEVOS ESTILOS PARA EL BREADCRUMB (IMAGEN) --- */
        .breadcrumb-section {
            max-width: 900px;
            margin: 40px auto 20px;
            padding: 0 20px;
            font-family: 'Montserrat', sans-serif;
        }

        .breadcrumb-nav {
            font-size: 28px;
            font-weight: 500;
            color: #4D4D4D;
            line-height: 1.2;
        }

        .breadcrumb-nav span.sep {
            color: #999;
            font-weight: 300;
            margin: 0 10px;
        }

        .breadcrumb-nav .docs-text {
            display: block;
            font-weight: 700;
            margin-top: 5px;
        }

        /* --- AJUSTES A LA CAJA DE BÚSQUEDA --- */
        main { flex: 1; max-width: 900px; margin: 0 auto 30px; padding: 0 15px; width: 100%; }
        
        .search-outer-box { 
            background: #ffffff; 
            border: 2px solid #D4C19C; /* Borde dorado de la imagen */
            border-radius: 12px; 
            padding: 40px; 
            max-width: 550px; 
            margin: 20px auto; 
            text-align: center; 
        }

        input { 
            width: 100%; 
            padding: 15px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 22px; 
            margin-bottom: 25px; 
            font-family: 'Lora', serif; 
            color: #666;
        }

        .btn-new { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 4px; 
            font-size: 20px; 
            cursor: pointer; 
            margin-bottom: 15px; 
            color: white; 
            font-family: 'Montserrat'; 
            font-weight: 500; 
            text-decoration: none; 
            display: block; 
        }

        .btn-buscar { background-color: var(--btn-buscar-verde); }
        .btn-limpiar { background-color: var(--btn-limpiar-gris); }
        
        .link-ayuda { 
            color: #C09A5B; 
            text-decoration: underline; 
            font-size: 18px; 
            display: inline-block;
            margin-top: 10px;
            font-weight: 400;
        }

        footer { background: var(--sep-rojo-obscuro); color: white; padding: 40px 30px; margin-top: 50px; text-align: center; }
    </style>
</head>
<body>

<div class="sticky-nav-container">
    <nav class="gob-header">
        <div class="header-left-group">
            <a href="https://www.gob.mx"><img class="logo-gob" src="https://consultadelestadoactual.info" alt="Gobierno de México"></a>
        </div>
        <i class="fas fa-bars menu-icon"></i>
    </nav>
    <div class="barra-dgb">
        <div class="dgb-brand">DGB</div>
    </div>
</div>

<!-- SECCIÓN AGREGADA SEGÚN LA IMAGEN -->
<div class="breadcrumb-section">
    <div class="breadcrumb-nav">
        Inicio <span class="sep">/</span> Consultas 
        <span class="docs-text">Documentos electrónicos académicos</span>
    </div>
</div>

<main>
    <div class="search-outer-box">
        <form>
            <input type="text" placeholder="Ingrese el folio" aria-label="Ingrese el folio">
            
            <button type="submit" class="btn-new btn-buscar">Buscar</button>
            <button type="reset" class="btn-new btn-limpiar">Restablecer</button>
            
            <a href="#" class="link-ayuda">Ubica el folio en tu certificado</a>
        </form>
    </div>
</main>

<footer>
    <p>&copy; 2024 Dirección General de Bachillerato - Secretaría de Educación Pública</p>
</footer>

</body>
</html>
